<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Firefly Swarm</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script>
        let particles = [];
        let holdDuration = 0;
        let maxHoldTime = 3000; // 3 seconds to reach max intensity
        let baseGlow = 40;
        let maxGlow = 100;
        let touchActive = false;
        let touchPos;
        let attractorForce = 0;
        let swarmCenter;
        let swarmRadius;

        class Particle {
            constructor() {
                this.reset();
                this.angle = random(TWO_PI);
                this.orbitSpeed = random(0.001, 0.003);
                this.orbitRadius = random(50, 200);
                this.phase = random(TWO_PI);
            }

            reset() {
                this.color = color(
                    random([
                        color(0, 255, 128), // Neon green
                        color(0, 255, 255), // Neon cyan
                        color(255, 0, 255), // Neon magenta
                        color(255, 255, 0)  // Neon yellow
                    ])
                );
                this.size = random(3, 6);
                this.pulsePhase = random(TWO_PI);
                this.pulseSpeed = random(0.02, 0.05);
            }

            update() {
                // Update orbit
                this.angle += this.orbitSpeed;
                this.pulsePhase += this.pulseSpeed;

                // Calculate base position on orbit
                let orbitX = swarmCenter.x + cos(this.angle) * this.orbitRadius;
                let orbitY = swarmCenter.y + sin(this.angle) * this.orbitRadius;
                
                // Add some organic movement
                let wobble = 20 * sin(this.pulsePhase);
                this.x = orbitX + wobble * cos(this.angle + HALF_PI);
                this.y = orbitY + wobble * sin(this.angle + HALF_PI);

                // If touch is active, attract particles
                if (touchActive && touchPos) {
                    let d = dist(this.x, this.y, touchPos.x, touchPos.y);
                    if (d < 200) {
                        let force = map(d, 0, 200, attractorForce, 0);
                        let angle = atan2(touchPos.y - this.y, touchPos.x - this.x);
                        this.x += cos(angle) * force;
                        this.y += sin(angle) * force;
                    }
                }
            }

            draw() {
                let intensity = map(sin(this.pulsePhase), -1, 1, 0.5, 1);
                if (touchActive) {
                    intensity = map(holdDuration, 0, maxHoldTime, intensity, 1.5);
                }
                
                // Calculate distance-based glow for touch position
                let touchGlow = 0;
                if (touchActive && touchPos) {
                    let d = dist(this.x, this.y, touchPos.x, touchPos.y);
                    touchGlow = map(d, 0, 200, maxGlow, 0, true);
                }

                let currentGlow = baseGlow + touchGlow;
                
                // Draw multiple layers for glow effect
                for (let i = 3; i > 0; i--) {
                    let size = this.size * i * intensity;
                    let alpha = map(i, 3, 1, 50, 255);
                    let c = color(this.color.levels);
                    c.setAlpha(alpha);
                    drawingContext.shadowBlur = currentGlow * intensity;
                    drawingContext.shadowColor = color(
                        red(this.color),
                        green(this.color),
                        blue(this.color),
                        alpha
                    ).toString();
                    fill(c);
                    noStroke();
                    circle(this.x, this.y, size);
                }
            }
        }

        function setup() {
            createCanvas(windowWidth, windowHeight);
            swarmCenter = createVector(width/2, height/2);
            swarmRadius = min(width, height) * 0.3;
            touchPos = createVector(0, 0);
            
            // Create initial particles
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle());
            }
        }

        function draw() {
            background(0, 20);

            // Update hold duration and attractor force
            if (touchActive) {
                holdDuration = min(holdDuration + deltaTime, maxHoldTime);
                attractorForce = map(holdDuration, 0, maxHoldTime, 0, 5);
                
                // Add more particles based on hold duration
                if (frameCount % 10 === 0 && particles.length < 200) {
                    let newParticles = map(holdDuration, 0, maxHoldTime, 0, 3, true);
                    for (let i = 0; i < newParticles; i++) {
                        particles.push(new Particle());
                    }
                }
            } else {
                holdDuration = max(0, holdDuration - deltaTime * 2);
                attractorForce = 0;
                
                // Remove excess particles
                if (frameCount % 30 === 0 && particles.length > 50) {
                    particles.pop();
                }
            }

            // Update and draw particles
            for (let p of particles) {
                p.update();
                p.draw();
            }
        }

        function mousePressed() {
            touchActive = true;
            touchPos.set(mouseX, mouseY);
        }

        function mouseDragged() {
            touchPos.set(mouseX, mouseY);
        }

        function mouseReleased() {
            touchActive = false;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            swarmCenter.set(width/2, height/2);
            swarmRadius = min(width, height) * 0.3;
        }

        // Mobile touch support
        function touchStarted() {
            if (touches.length > 0) {
                touchActive = true;
                touchPos.set(touches[0].x, touches[0].y);
            }
            return false;
        }

        function touchMoved() {
            if (touches.length > 0) {
                touchPos.set(touches[0].x, touches[0].y);
            }
            return false;
        }

        function touchEnded() {
            touchActive = false;
            return false;
        }
    </script>
</body>
</html>
