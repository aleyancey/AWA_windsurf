<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Firefly Swarm</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #001;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script>
        let particles = [];
        let attractPoint = { x: 0, y: 0 };
        let isPressed = false;
        let holdDuration = 0;
        let maxHoldTime = 100;
        
        // Neon color palette
        const colors = [
            { r: 0, g: 255, b: 128 },  // Neon green
            { r: 0, g: 255, b: 255 },  // Neon cyan
            { r: 128, g: 255, b: 255 }, // Light cyan
            { r: 0, g: 200, b: 150 }   // Seafoam
        ];

        class Particle {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.vel = p5.Vector.random2D().mult(random(0.5, 2));
                this.acc = createVector();
                this.color = random(colors);
                this.baseSize = random(3, 6);
                this.size = this.baseSize;
                this.maxSpeed = 4;
                this.angle = random(TWO_PI);
                this.angleVel = random(-0.02, 0.02);
                this.glowIntensity = random(0.5, 1);
                this.originalGlow = this.glowIntensity;
            }

            applyForce(force) {
                this.acc.add(force);
            }

            update() {
                // Circular motion
                this.angle += this.angleVel;
                let circleRadius = 200;
                let circleX = width/2 + cos(this.angle) * circleRadius;
                let circleY = height/2 + sin(this.angle) * circleRadius;
                let desired = createVector(circleX, circleY).sub(this.pos);
                desired.setMag(this.maxSpeed);
                let steer = desired.sub(this.vel);
                steer.limit(0.1);
                this.applyForce(steer);

                // Mouse/touch attraction
                if (isPressed) {
                    let mousePos = createVector(attractPoint.x, attractPoint.y);
                    let dir = p5.Vector.sub(mousePos, this.pos);
                    let d = dir.mag();
                    if (d < 200) {
                        dir.setMag(map(d, 0, 200, 3, 0));
                        this.applyForce(dir);
                        // Increase glow based on proximity and hold duration
                        let holdFactor = map(holdDuration, 0, maxHoldTime, 1, 2.5);
                        this.glowIntensity = this.originalGlow * holdFactor * map(d, 200, 0, 1, 3);
                        this.size = this.baseSize * map(d, 200, 0, 1, 1.5);
                    }
                } else {
                    // Return to original glow
                    this.glowIntensity = lerp(this.glowIntensity, this.originalGlow, 0.1);
                    this.size = lerp(this.size, this.baseSize, 0.1);
                }

                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.pos.add(this.vel);
                this.acc.mult(0);

                // Wrap around edges
                if (this.pos.x < 0) this.pos.x = width;
                if (this.pos.x > width) this.pos.x = 0;
                if (this.pos.y < 0) this.pos.y = height;
                if (this.pos.y > height) this.pos.y = 0;
            }

            draw() {
                let alpha = map(this.glowIntensity, 0.5, 2.5, 100, 255);
                
                // Draw glow
                for (let i = 3; i > 0; i--) {
                    let size = this.size * (i * 2);
                    let glowAlpha = alpha / (i * 2);
                    fill(this.color.r, this.color.g, this.color.b, glowAlpha);
                    noStroke();
                    circle(this.pos.x, this.pos.y, size);
                }
                
                // Draw core
                fill(255, alpha);
                circle(this.pos.x, this.pos.y, this.size);
            }
        }

        function setup() {
            createCanvas(windowWidth, windowHeight);
            background(0);
            
            // Create initial particles
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle(random(width), random(height)));
            }
        }

        function draw() {
            background(0, 20);
            
            if (isPressed) {
                holdDuration = min(holdDuration + 1, maxHoldTime);
                // Add new particles while holding
                if (frameCount % 5 === 0 && particles.length < 300) {
                    particles.push(new Particle(random(width), random(height)));
                }
            } else {
                holdDuration = max(holdDuration - 2, 0);
                // Remove excess particles
                if (particles.length > 100 && frameCount % 30 === 0) {
                    particles.pop();
                }
            }

            // Update and draw particles
            for (let particle of particles) {
                particle.update();
                particle.draw();
            }
        }

        function mousePressed() {
            isPressed = true;
            attractPoint.x = mouseX;
            attractPoint.y = mouseY;
        }

        function mouseDragged() {
            attractPoint.x = mouseX;
            attractPoint.y = mouseY;
        }

        function mouseReleased() {
            isPressed = false;
        }

        function touchStarted() {
            isPressed = true;
            attractPoint.x = touches[0].x;
            attractPoint.y = touches[0].y;
            return false;
        }

        function touchMoved() {
            attractPoint.x = touches[0].x;
            attractPoint.y = touches[0].y;
            return false;
        }

        function touchEnded() {
            isPressed = false;
            return false;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
