<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Firefly Swarm</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script>
        let particles = [];
        let holdDuration = 0;
        let maxHoldTime = 2000; // ms to reach max intensity
        let touchActive = false;
        let touchPos;
        let baseParticleCount = 200;
        let maxExtraParticles = 300;

        class Particle {
            constructor(x, y) {
                this.pos = createVector(x || random(width), y || random(height));
                this.vel = p5.Vector.random2D().mult(random(0.5, 2));
                this.acc = createVector();
                this.size = random(3, 6);
                this.color = {
                    h: random([
                        color(0, 255, 128),  // Neon green
                        color(0, 255, 255),  // Neon cyan
                        color(255, 0, 255),  // Neon magenta
                        color(128, 0, 255),  // Neon purple
                        color(255, 255, 0)   // Neon yellow
                    ]),
                    alpha: random(100, 200)
                };
                this.angle = random(TWO_PI);
                this.angleVel = random(-0.02, 0.02);
                this.radius = random(50, 150);
                this.centerAttraction = random(0.001, 0.003);
                this.originalSize = this.size;
            }

            update(touchPos, touchIntensity) {
                // Circular motion
                this.angle += this.angleVel;
                let center = createVector(width/2, height/2);
                
                // Calculate target position on circular path
                let targetX = center.x + cos(this.angle) * this.radius;
                let targetY = center.y + sin(this.angle) * this.radius;
                let target = createVector(targetX, targetY);
                
                // Add attraction to circular path
                let attraction = p5.Vector.sub(target, this.pos);
                attraction.mult(this.centerAttraction);
                this.acc.add(attraction);

                // Touch influence
                if (touchPos) {
                    let d = p5.Vector.dist(this.pos, touchPos);
                    if (d < 200) {
                        let force = p5.Vector.sub(touchPos, this.pos);
                        force.setMag(0.2 * touchIntensity);
                        this.acc.add(force);
                        
                        // Increase size and brightness near touch
                        let sizeFactor = map(d, 0, 200, 2.5, 1);
                        this.size = this.originalSize * sizeFactor * (1 + touchIntensity);
                        this.color.alpha = map(d, 0, 200, 255, 150) * (1 + touchIntensity * 0.5);
                    } else {
                        this.size = lerp(this.size, this.originalSize, 0.1);
                        this.color.alpha = lerp(this.color.alpha, random(100, 200), 0.1);
                    }
                }

                // Update motion
                this.vel.add(this.acc);
                this.vel.limit(3);
                this.pos.add(this.vel);
                this.acc.mult(0);

                // Wrap around edges
                if (this.pos.x < 0) this.pos.x = width;
                if (this.pos.x > width) this.pos.x = 0;
                if (this.pos.y < 0) this.pos.y = height;
                if (this.pos.y > height) this.pos.y = 0;
            }

            draw() {
                // Glow effect
                drawingContext.shadowBlur = this.size * 2;
                drawingContext.shadowColor = color(red(this.color.h), 
                                                 green(this.color.h), 
                                                 blue(this.color.h), 
                                                 this.color.alpha);
                
                // Core
                noStroke();
                fill(red(this.color.h), 
                     green(this.color.h), 
                     blue(this.color.h), 
                     this.color.alpha);
                circle(this.pos.x, this.pos.y, this.size);
                
                // Additional glow layers
                for (let i = 0; i < 3; i++) {
                    fill(red(this.color.h), 
                         green(this.color.h), 
                         blue(this.color.h), 
                         this.color.alpha * 0.3);
                    circle(this.pos.x, this.pos.y, this.size * (1 + i * 0.5));
                }
            }
        }

        function setup() {
            createCanvas(windowWidth, windowHeight);
            colorMode(RGB);
            background(0);
            
            // Initialize particles
            for (let i = 0; i < baseParticleCount; i++) {
                particles.push(new Particle());
            }
            
            touchPos = createVector(0, 0);
        }

        function draw() {
            background(0, 20);
            
            // Update hold duration and calculate intensity
            let touchIntensity = 0;
            if (touchActive) {
                holdDuration = min(holdDuration + deltaTime, maxHoldTime);
                touchIntensity = holdDuration / maxHoldTime;
                
                // Add more particles based on hold duration
                if (particles.length < baseParticleCount + maxExtraParticles * touchIntensity) {
                    particles.push(new Particle(touchPos.x, touchPos.y));
                }
            } else {
                holdDuration = max(0, holdDuration - deltaTime * 2);
                // Remove extra particles gradually
                if (particles.length > baseParticleCount) {
                    particles.pop();
                }
            }

            // Update and draw particles
            for (let p of particles) {
                p.update(touchActive ? touchPos : null, touchIntensity);
                p.draw();
            }
        }

        function mousePressed() {
            touchActive = true;
            touchPos = createVector(mouseX, mouseY);
        }

        function mouseDragged() {
            touchPos.set(mouseX, mouseY);
            return false;
        }

        function mouseReleased() {
            touchActive = false;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        // Mobile touch support
        function touchStarted() {
            if (touches.length > 0) {
                touchActive = true;
                touchPos.set(touches[0].x, touches[0].y);
            }
            return false;
        }

        function touchMoved() {
            if (touches.length > 0) {
                touchPos.set(touches[0].x, touches[0].y);
            }
            return false;
        }

        function touchEnded() {
            touchActive = false;
            return false;
        }
    </script>
</body>
</html>
