<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Firefly Swarm</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script>
        let particles = [];
        let attractPoint = null;
        let holdDuration = 0;
        let maxParticles = 300;
        let baseGlow = 40;
        let touchGlow = 0;
        
        // Neon color palette
        const colors = [
            [0, 255, 200],    // Cyan
            [255, 0, 255],    // Magenta
            [255, 255, 0],    // Yellow
            [0, 255, 100],    // Green
            [255, 100, 255]   // Pink
        ];

        class Particle {
            constructor(x, y) {
                this.pos = createVector(x || random(width), y || random(height));
                this.vel = p5.Vector.random2D().mult(random(2, 4));
                this.acc = createVector();
                this.color = random(colors);
                this.size = random(3, 6);
                this.maxSpeed = random(4, 7);
                this.phase = random(TWO_PI);
                this.phaseSpeed = random(0.02, 0.05);
            }

            applyForce(force) {
                this.acc.add(force);
            }

            update() {
                // Oscillating size and brightness
                this.currentSize = this.size + sin(this.phase) * 2;
                this.phase += this.phaseSpeed;

                // Attraction to mouse/touch point
                if (attractPoint) {
                    let force = p5.Vector.sub(attractPoint, this.pos);
                    let d = force.mag();
                    d = constrain(d, 5, 25);
                    let G = 50 * (holdDuration / 60); // Increased attraction with hold
                    force.setMag(G / (d * d));
                    this.applyForce(force);
                }

                // Circular motion tendency
                let center = createVector(width/2, height/2);
                let toCenter = p5.Vector.sub(center, this.pos);
                let circularForce = toCenter.copy().rotate(HALF_PI).setMag(0.3);
                this.applyForce(circularForce);

                // Update motion
                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.pos.add(this.vel);
                this.acc.mult(0);

                // Wrap around edges
                if (this.pos.x < 0) this.pos.x = width;
                if (this.pos.x > width) this.pos.x = 0;
                if (this.pos.y < 0) this.pos.y = height;
                if (this.pos.y > height) this.pos.y = 0;
            }

            draw() {
                let glowAmount = baseGlow;
                
                // Increase glow near attract point
                if (attractPoint) {
                    let d = p5.Vector.dist(this.pos, attractPoint);
                    if (d < 150) {
                        glowAmount += map(150 - d, 0, 150, 0, touchGlow);
                    }
                }

                // Inner glow
                drawingContext.shadowBlur = glowAmount;
                drawingContext.shadowColor = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                
                // Particle core
                noStroke();
                fill(this.color[0], this.color[1], this.color[2]);
                circle(this.pos.x, this.pos.y, this.currentSize);

                // Outer glow
                let alpha = map(sin(this.phase), -1, 1, 30, 100);
                fill(this.color[0], this.color[1], this.color[2], alpha);
                circle(this.pos.x, this.pos.y, this.currentSize * 1.5);
            }
        }

        function setup() {
            createCanvas(windowWidth, windowHeight);
            background(0);
            
            // Initial particle creation
            for (let i = 0; i < maxParticles/2; i++) {
                particles.push(new Particle());
            }
        }

        function draw() {
            background(0, 20);

            // Update hold duration and effects
            if (mouseIsPressed || touches.length > 0) {
                holdDuration = min(holdDuration + 1, 120);
                touchGlow = map(holdDuration, 0, 120, 60, 120);
                
                // Add particles while holding
                if (particles.length < maxParticles && frameCount % 2 === 0) {
                    particles.push(new Particle(
                        attractPoint.x + random(-50, 50),
                        attractPoint.y + random(-50, 50)
                    ));
                }
            } else {
                holdDuration = max(holdDuration - 2, 0);
                touchGlow = map(holdDuration, 0, 120, 60, 120);
            }

            // Update and draw particles
            for (let p of particles) {
                p.update();
                p.draw();
            }

            // Gradually remove particles when not holding
            if (!mouseIsPressed && !touches.length && particles.length > maxParticles/2 && frameCount % 10 === 0) {
                particles.pop();
            }
        }

        function mousePressed() {
            attractPoint = createVector(mouseX, mouseY);
        }

        function mouseDragged() {
            attractPoint = createVector(mouseX, mouseY);
        }

        function mouseReleased() {
            attractPoint = null;
        }

        function touchStarted() {
            if (touches.length > 0) {
                attractPoint = createVector(touches[0].x, touches[0].y);
            }
            return false;
        }

        function touchMoved() {
            if (touches.length > 0) {
                attractPoint = createVector(touches[0].x, touches[0].y);
            }
            return false;
        }

        function touchEnded() {
            attractPoint = null;
            return false;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
