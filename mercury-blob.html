<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mercury Circle</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000;
            cursor: grab;
        }
        body.grabbing {
            cursor: grabbing;
        }
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Camera position - more top-down view
        camera.position.set(0, 4, 0.1);
        camera.lookAt(0, 0, 0);

        // Ground plane
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const planeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x202020,
            roughness: 0.8,
            metalness: 0.2
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        // Lighting setup for precise highlights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const topLight = new THREE.DirectionalLight(0xffffff, 0.8);
        topLight.position.set(0, 5, 0);
        scene.add(topLight);

        // Create perfect circle mercury
        class MercuryCircle {
            constructor() {
                // Create a very flat cylinder for the perfect circle
                this.geometry = new THREE.CylinderGeometry(1, 1, 0.08, 64, 1);
                
                // Custom shader for precise mercury appearance
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 },
                        mouseInfluence: { value: 0 },
                        mousePos: { value: new THREE.Vector2(0, 0) }
                    },
                    vertexShader: `
                        varying vec3 vNormal;
                        varying vec3 vPosition;
                        varying vec2 vUv;
                        uniform float time;
                        uniform float mouseInfluence;
                        uniform vec2 mousePos;

                        void main() {
                            vUv = uv;
                            vNormal = normal;
                            vec3 pos = position;
                            
                            // Subtle surface movement
                            float edge = smoothstep(0.9, 1.0, length(pos.xz));
                            float height = 0.08 * (1.0 - edge * 0.3);
                            pos.y *= height;
                            
                            // Very subtle ripple
                            float ripple = sin(length(pos.xz) * 6.0 - time) * 0.005;
                            pos.y += ripple * (1.0 - edge);
                            
                            vPosition = pos;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                        }
                    `,
                    fragmentShader: `
                        varying vec3 vNormal;
                        varying vec3 vPosition;
                        varying vec2 vUv;
                        uniform float time;

                        void main() {
                            // Perfect mercury color
                            vec3 baseColor = vec3(0.85, 0.85, 0.87);
                            
                            // Sharp edge highlight
                            float edge = smoothstep(0.8, 1.0, length(vPosition.xz));
                            
                            // Precise metallic reflection
                            vec3 normal = normalize(vNormal);
                            float fresnel = pow(1.0 - abs(dot(normal, vec3(0.0, 1.0, 0.0))), 1.5);
                            
                            // Combine for perfect mercury look
                            vec3 color = mix(baseColor, vec3(1.0), fresnel * 0.5);
                            color = mix(color, vec3(0.7), edge * 0.3);
                            
                            // Add subtle highlight
                            float highlight = pow(max(0.0, dot(normal, normalize(vec3(0.0, 1.0, 0.1)))), 16.0);
                            color += vec3(highlight) * 0.2;
                            
                            gl_FragColor = vec4(color, 1.0);
                        }
                    `,
                    side: THREE.DoubleSide
                });

                this.mesh = new THREE.Mesh(this.geometry, this.material);
                this.mesh.position.y = 0.04; // Just above ground
                scene.add(this.mesh);

                // Movement properties
                this.velocity = new THREE.Vector3();
                this.acceleration = new THREE.Vector3();
                this.damping = 0.92;
                this.mouseForce = new THREE.Vector3();
            }

            update(deltaTime, mousePosition) {
                // Update time uniform for subtle animation
                this.material.uniforms.time.value += deltaTime;
                
                // Handle mouse interaction
                if (mousePosition) {
                    const distance = this.mesh.position.distanceTo(mousePosition);
                    if (distance < 2) {
                        this.mouseForce.subVectors(mousePosition, this.mesh.position);
                        this.mouseForce.normalize();
                        this.mouseForce.multiplyScalar(0.003); // Very subtle movement
                        this.acceleration.add(this.mouseForce);
                    }
                }

                // Update position with smooth movement
                this.velocity.add(this.acceleration);
                this.velocity.multiplyScalar(this.damping);
                this.mesh.position.add(this.velocity);

                // Keep at constant height
                this.mesh.position.y = 0.04;

                // Constrain to visible area
                const maxDistance = 4;
                const currentDistance = Math.sqrt(
                    this.mesh.position.x * this.mesh.position.x +
                    this.mesh.position.z * this.mesh.position.z
                );
                if (currentDistance > maxDistance) {
                    const angle = Math.atan2(this.mesh.position.z, this.mesh.position.x);
                    this.mesh.position.x = maxDistance * Math.cos(angle);
                    this.mesh.position.z = maxDistance * Math.sin(angle);
                    this.velocity.multiplyScalar(0.5);
                }

                // Reset acceleration
                this.acceleration.set(0, 0, 0);
            }
        }

        // Create mercury circle
        const mercury = new MercuryCircle();

        // Mouse interaction
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        let isDragging = false;
        let mousePosition = new THREE.Vector3();

        document.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(plane);
            
            if (intersects.length > 0) {
                mousePosition.copy(intersects[0].point);
                mercury.material.uniforms.mousePos.value.set(
                    mousePosition.x,
                    mousePosition.z
                );
            }

            if (isDragging) {
                document.body.classList.add('grabbing');
                mercury.material.uniforms.mouseInfluence.value = 1.0;
            }
        });

        document.addEventListener('mousedown', () => {
            isDragging = true;
            document.body.classList.add('grabbing');
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            document.body.classList.remove('grabbing');
            mercury.material.uniforms.mouseInfluence.value = 0.0;
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = clock.getDelta();
            mercury.update(deltaTime, isDragging ? mousePosition : null);
            
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
